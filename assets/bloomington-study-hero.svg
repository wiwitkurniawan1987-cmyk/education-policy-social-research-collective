<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bloomington-inspired study table</title>
  <desc id="desc">An abstract cream and crimson study table with books, notes, window light, autumn leaves, and limestone texture.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#35231f"/>
      <stop offset="0.42" stop-color="#6f2929"/>
      <stop offset="1" stop-color="#f3e4cc"/>
    </linearGradient>
    <linearGradient id="table" x1="0" x2="1">
      <stop offset="0" stop-color="#4a211d"/>
      <stop offset="0.52" stop-color="#8f1d21"/>
      <stop offset="1" stop-color="#c28f58"/>
    </linearGradient>
    <radialGradient id="light" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#fff7de" stop-opacity="0.92"/>
      <stop offset="0.46" stop-color="#f0c879" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2b1b18" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2b1b18" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1800" height="1000" fill="url(#wall)"/>
  <rect width="1800" height="1000" fill="url(#light)"/>
  <rect width="1800" height="1000" filter="url(#grain)" opacity="0.7"/>

  <g opacity="0.26" stroke="#f4efe6" stroke-width="2">
    <path d="M590 0v645"/>
    <path d="M785 0v625"/>
    <path d="M980 0v595"/>
    <path d="M1180 0v570"/>
    <path d="M520 210h720"/>
    <path d="M485 432h820"/>
  </g>

  <g transform="translate(1210 70)">
    <rect x="0" y="0" width="430" height="535" fill="#251a18" opacity="0.86"/>
    <rect x="28" y="28" width="374" height="480" fill="#f4efe6" opacity="0.2"/>
    <rect x="55" y="56" width="320" height="425" fill="#fff8e6" opacity="0.72"/>
    <g opacity="0.88">
      <circle cx="160" cy="120" r="85" fill="#d5a348" opacity="0.42"/>
      <path d="M120 210c44-70 113-98 214-110-78 52-124 108-150 194z" fill="#8f1d21" opacity="0.72"/>
      <path d="M86 326c70-84 160-112 272-116-86 56-157 126-201 207z" fill="#b84734" opacity="0.58"/>
      <path d="M262 278c48-34 92-45 145-38-38 30-72 64-103 115z" fill="#526947" opacity="0.42"/>
    </g>
  </g>

  <path d="M315 650 1800 560v440H0V742z" fill="url(#table)"/>
  <path d="M315 650 1800 560" stroke="#f1d6c4" stroke-width="5" opacity="0.5"/>

  <g filter="url(#shadow)" transform="translate(725 620) rotate(-3)">
    <rect x="0" y="0" width="430" height="164" fill="#f7ecd8"/>
    <path d="M30 30h360M30 60h305M30 90h345M30 120h250" stroke="#7c6f65" stroke-width="5" opacity="0.42"/>
    <path d="M206 0v164" stroke="#8f1d21" stroke-width="4" opacity="0.5"/>
  </g>

  <g filter="url(#shadow)" transform="translate(1090 585) rotate(4)">
    <rect x="0" y="0" width="330" height="52" fill="#8f1d21"/>
    <rect x="0" y="52" width="330" height="34" fill="#f6ead4"/>
    <rect x="0" y="86" width="330" height="52" fill="#6f2929"/>
  </g>

  <g filter="url(#shadow)" transform="translate(515 695) rotate(-7)">
    <rect x="0" y="0" width="250" height="42" fill="#f4efe6"/>
    <rect x="0" y="42" width="250" height="48" fill="#b84734"/>
    <rect x="0" y="90" width="250" height="38" fill="#eadcc4"/>
  </g>

  <g transform="translate(1258 476)">
    <ellipse cx="54" cy="122" rx="54" ry="18" fill="#2b1b18" opacity="0.28"/>
    <path d="M18 32h72l-10 88H28z" fill="#6f2929"/>
    <ellipse cx="54" cy="34" rx="38" ry="12" fill="#9b6c4b"/>
    <g fill="#8f1d21">
      <path d="M54 11 68 52 48 42z"/>
      <path d="M54 11 43 54 31 34z"/>
      <path d="M76 20 84 59 62 46z"/>
      <path d="M32 18 45 57 22 46z"/>
      <path d="M62 6 96 31 70 32z"/>
      <path d="M43 8 15 34 42 31z"/>
    </g>
  </g>

  <g transform="translate(1375 690)" filter="url(#shadow)">
    <path d="M0 0h190v135H0z" fill="#f7ecd8"/>
    <path d="M22 34h145M22 61h118M22 88h132" stroke="#7c6f65" stroke-width="5" opacity="0.38"/>
  </g>

  <g transform="translate(1500 612)" filter="url(#shadow)">
    <ellipse cx="58" cy="18" rx="58" ry="18" fill="#7a2827"/>
    <path d="M10 18h96l-16 96H26z" fill="#4a211d"/>
    <path d="M104 44c55-8 55 66 4 58" fill="none" stroke="#4a211d" stroke-width="16"/>
  </g>

  <path d="M0 0h790v1000H0z" fill="#2b1b18" opacity="0.48"/>
</svg>
